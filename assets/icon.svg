<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c6cf0"/>
      <stop offset="1" stop-color="#4646b8"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="128" height="128" fill="#000"/>
      <circle cx="60" cy="64" r="34" fill="#fff"/>
      <circle cx="78" cy="52" r="30" fill="#000"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" fill="#fff" mask="url(#crescent)"/>
  <!-- A cow spot, because it is MoonCow. -->
  <ellipse cx="47" cy="76" rx="7.5" ry="6" fill="#4f4fc4" transform="rotate(-20 47 76)"/>
  <circle cx="92" cy="86" r="5" fill="#fff" opacity="0.9"/>
</svg>
